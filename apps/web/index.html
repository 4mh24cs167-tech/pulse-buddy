<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230ea5e9'/><circle cx='38' cy='42' r='5' fill='white'/><circle cx='62' cy='42' r='5' fill='white'/><path d='M35 60 Q50 75 65 60' stroke='white' stroke-width='6' fill='none' stroke-linecap='round'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="description" content="Pulse Buddy - Animated Avatar Reminder Platform" />
    <link rel="manifest" href="/manifest.json" />
    <title>Pulse Buddy — Avatar Reminder Platform</title>

    <!-- Automatic stale-cache recovery -->
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var url = target.src || target.href || '';
            if (url.indexOf('/assets/') !== -1) {
              console.warn('Detected stale asset load failure (404), auto-purging cache:', url);
              if (!sessionStorage.getItem('pb_stale_asset_retry')) {
                sessionStorage.setItem('pb_stale_asset_retry', '1');
                if ('caches' in window) {
                  caches.keys().then(function(keys) {
                    return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                  }).then(function() {
                    window.location.reload(true);
                  }).catch(function() {
                    window.location.reload(true);
                  });
                } else {
                  window.location.reload(true);
                }
              }
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            // Check for service worker updates immediately on page load
            registration.update();
          }).catch(function() {});
        });
      }
    </script>
  </body>
</html>
