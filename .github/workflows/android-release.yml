name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Signing Secrets Exist
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "ERROR: KEYSTORE_BASE64 secret is missing. Cannot produce a signed Play Store release."
          exit 1

      - name: Inject Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build Android Release AAB
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease

      - name: Build Android Release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Locate Android build-tools apksigner
        id: locate_apksigner
        run: |
          APKSIGNER_PATH=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -r | head -n 1)
          if [ -z "$APKSIGNER_PATH" ]; then
            echo "ERROR: apksigner not found in Android SDK."
            exit 1
          fi
          echo "Found apksigner at: $APKSIGNER_PATH"
          $APKSIGNER_PATH --version
          echo "apksigner_path=$APKSIGNER_PATH" >> $GITHUB_ENV

      - name: Verify Signatures and Extract Manifest Data
        id: verify_sig
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          
          if [ ! -f "$AAB_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Missing release artifacts."
            exit 1
          fi
          
          # Verify APK signature
          $apksigner_path verify --print-certs "$APK_PATH" > apk_certs.txt
          cat apk_certs.txt
          
          # Verify AAB signature
          jarsigner -verify -certs -strict "$AAB_PATH" > aab_certs.txt
          
          # Get SHA-256 Hashes
          AAB_SHA=$(sha256sum "$AAB_PATH" | awk '{print $1}')
          APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          CERT_SHA=$(keytool -list -v -keystore android/app/release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep "SHA256: " | sed 's/.*SHA256: //')
          
          # Dynamic Versioning
          VERSION_NAME=$(grep versionName android/app/build.gradle | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep versionCode android/app/build.gradle | awk '{print $2}')
          TARGET_SDK=$(grep "targetSdkVersion =" android/variables.gradle | awk -F'=' '{print $2}' | tr -d ' ' || echo "36")
          
          echo "VersionName: $VERSION_NAME" > release_manifest.txt
          echo "VersionCode: $VERSION_CODE" >> release_manifest.txt
          echo "ApplicationId: com.pulse.buddy" >> release_manifest.txt
          echo "TargetSdk: $TARGET_SDK" >> release_manifest.txt
          echo "AAB SHA-256: $AAB_SHA" >> release_manifest.txt
          echo "APK SHA-256: $APK_SHA" >> release_manifest.txt
          echo "Cert SHA-256: $CERT_SHA" >> release_manifest.txt
          
          echo "Manifest Generated:"
          cat release_manifest.txt

      - name: Upload Artifact AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release Manifest
        uses: actions/upload-artifact@v4
        with:
          name: release_manifest.txt
          path: release_manifest.txt
